name: rental-camera
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rentalcamera-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Configure a private SQL password}"
    ports:
      - "${SQL_PORT:-14330}:1433"
    volumes:
      - rentalcamera-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=$$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  # Readiness gate only. Provision/migrate explicitly using Database/README.md.
  # No automatic seed, legacy backfill or schema replay on an existing database.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD:?Configure a private SQL password}"
      DATABASE_NAME: "${DATABASE_NAME:-RentalCameraDb20}"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./Database:/database:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -I -b -d "$$DATABASE_NAME" -Q "IF OBJECT_ID('dbo.LuaChonGioHangGiuCho','U') IS NULL OR OBJECT_ID('dbo.NotificationDelivery','U') IS NULL OR OBJECT_ID('dbo.LichSuHienThiDanhGia','U') IS NULL OR COL_LENGTH('dbo.PhuLuc','HanKyUtc') IS NULL THROW 51900,'Apply the reviewed deployment migrations first; no automatic changes were made.',1;"
    restart: "no"
  api:
    build:
      context: .
      dockerfile: RentalCamera.Api/Dockerfile
    container_name: rentalcamera-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__RentalCamera: "Server=sqlserver,1433;Database=${DATABASE_NAME:-RentalCameraDb20};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://127.0.0.1:5173
      Cors__AllowedOrigins__2: http://localhost:3000
      Cors__AllowedOrigins__3: http://localhost:4200
      Rental__HoldMinutes: "20"
      Rental__ContractSignMinutes: "30"
      Rental__BackgroundJobsEnabled: "false"
      Rental__ProtectedContractIds: "${RENTAL_PROTECTED_CONTRACT_IDS:-}"
      Notifications__PushEnabled: "false"
      PasswordReset__ReturnTokenInResponse: "false"
      ElectronicSignature__TermsVersion: "2026-10-20"
      ElectronicSignature__ReturnOtpInResponse: "false"
      ElectronicSignature__Pepper: "${ELECTRONIC_SIGNATURE_PEPPER:-}"
      Email__Enabled: "${EMAIL_ENABLED:-false}"
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__UseSsl: "${EMAIL_USE_SSL:-true}"
      Email__Username: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-}"
      Email__FromName: "${EMAIL_FROM_NAME:-SNAPLEASE}"
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID:?Configure Firebase project}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-}"
      Cloudinary__EvidenceFolder: "${CLOUDINARY_EVIDENCE_FOLDER:-rental-camera/bien-ban}"
      Cloudinary__ReviewFolder: "${CLOUDINARY_REVIEW_FOLDER:-rental-camera/danh-gia}"
      Vnpay__Enabled: "${VNPAY_ENABLED:-false}"
      Vnpay__TmnCode: "${VNPAY_TMN_CODE:-}"
      Vnpay__HashSecret: "${VNPAY_HASH_SECRET:-}"
      Vnpay__PaymentUrl: "${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
      Vnpay__ReturnUrl: "${VNPAY_RETURN_URL:-}"
      Vnpay__IpnUrl: "${VNPAY_IPN_URL:-}"
      Vnpay__MobileCallbackUrl: "${VNPAY_MOBILE_CALLBACK_URL:-rentalcamera://payment-result}"
      BankTransfer__NganHang: "${BANK_TRANSFER_NGAN_HANG:-}"
      BankTransfer__MaBin: "${BANK_TRANSFER_MA_BIN:-}"
      BankTransfer__SoTaiKhoan: "${BANK_TRANSFER_SO_TAI_KHOAN:-}"
      BankTransfer__ChuTaiKhoan: "${BANK_TRANSFER_CHU_TAI_KHOAN:-}"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - rentalcamera-api-keys:/app/.keys
      - rentalcamera-api-storage:/app/Storage
      - rentalcamera-contract-files:/app/App_Data/contracts
    secrets:
      - firebase_admin
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  rentalcamera-sql-data:
  rentalcamera-api-keys:
  rentalcamera-api-storage:
  rentalcamera-contract-files:
secrets:
  firebase_admin:
    file: "${FIREBASE_ADMIN_CREDENTIALS_FILE:?Configure a private Firebase service-account file}"
