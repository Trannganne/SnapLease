name: rentcam
description: RentCam mobile UI - Flutter, BLoC, GoRouter.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  go_router: ^14.8.1
  intl: ^0.20.2
  equatable: ^3.0.0
  image_picker: ^1.2.3
  pdf: ^3.12.0
  printing: ^5.14.3
  signature: ^6.4.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  dio: ^5.11.1
  uuid: ^4.6.0
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_barcode_scanning: ^0.15.0
  camera: ^0.12.0+2
  image: ^4.10.1
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  table_calendar: ^3.2.1
  http_parser: ^4.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
